name: Check Pošte Srpske Calculator

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-calculator:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run calculator diagnostic
        run: |
          python check_srpske_calculator.py

      - name: Display diagnostic output
        if: always()
        run: |
          echo "============================================================"
          echo "Diagnostic files"
          echo "============================================================"

          if [ -f calculator_after_destination.html ]; then
            echo "HTML file was created."
            echo "HTML size:"
            wc -c calculator_after_destination.html
          else
            echo "No HTML diagnostic file."
          fi

          if [ -f calculator_after_destination.png ]; then
            echo "Screenshot was created."
            echo "Screenshot size:"
            wc -c calculator_after_destination.png
          else
            echo "No screenshot diagnostic file."
          fi

          if [ -f results.txt ]; then
            echo "results.txt exists:"
            cat results.txt
          else
            echo "No results.txt was created. This is expected for this diagnostic."
          fi

      - name: Upload diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calculator-diagnostic
          path: |
            calculator_after_destination.html
            calculator_after_destination.png
          if-no-files-found: ignore
