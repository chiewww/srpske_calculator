name: Check Pošte Srpske Calculator

on:
  schedule:
    # Run every 6 hours
    - cron: "0 */6 * * *"

  # Allows you to run the workflow manually from GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-calculator:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # 1. Check out the repository
      # ------------------------------------------------------------
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Set up Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # 3. Install Python dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ------------------------------------------------------------
      # 4. Install Playwright Chromium
      # ------------------------------------------------------------
      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      # ------------------------------------------------------------
      # 5. Run the calculator checker
      # ------------------------------------------------------------
      - name: Run calculator checker
        run: |
          python check_srpske_calculator.py

      # ------------------------------------------------------------
      # 6. Show the generated results
      # ------------------------------------------------------------
      - name: Display results
        run: |
          echo "============================================================"
          echo "results.txt"
          echo "============================================================"
          cat results.txt

      # ------------------------------------------------------------
      # 7. Commit results.txt if it changed
      # ------------------------------------------------------------
      - name: Commit updated results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add results.txt

          if git diff --cached --quiet; then
            echo "No changes to results.txt."
          else
            git commit -m "Update calculator results"
            git push
          fi
