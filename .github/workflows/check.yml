name: Check Pošte Srpske Calculator

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-calculator:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run calculator diagnostic
        run: |
          python check_srpske_calculator.py

      - name: Check diagnostic output
        if: always()
        run: |
          echo "============================================================"
          echo "Diagnostic completed"
          echo "============================================================"

          if [ -f results.txt ]; then
            echo "results.txt exists:"
            cat results.txt
          else
            echo "No results.txt was created by the diagnostic script."
          fi
```
